<title>Grafo Mecánica Cuántica UVa</title>
<style>
:root {
  --bg: #F7F9FB;
  --surface: #FFFFFF;
  --ink: #1C2733;
  --muted: #5B6B7A;
  --line: #D8E0E8;
  --accent: #1D5FC2;
  --accent-ink: #FFFFFF;
  --accent-soft: rgba(29, 95, 194, 0.10);
  --copper: #B4690E;
  --copper-soft: rgba(180, 105, 14, 0.12);
  --sel: #12345E;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E141B;
    --surface: #16202B;
    --ink: #E2E9F0;
    --muted: #8FA1B3;
    --line: #26323F;
    --accent: #6FA5F2;
    --accent-ink: #0E141B;
    --accent-soft: rgba(111, 165, 242, 0.14);
    --copper: #E39A4E;
    --copper-soft: rgba(227, 154, 78, 0.14);
    --sel: #BDD7FF;
  }
}
:root[data-theme="light"] {
  --bg: #F7F9FB; --surface: #FFFFFF; --ink: #1C2733; --muted: #5B6B7A;
  --line: #D8E0E8; --accent: #1D5FC2; --accent-ink: #FFFFFF;
  --accent-soft: rgba(29, 95, 194, 0.10); --copper: #B4690E;
  --copper-soft: rgba(180, 105, 14, 0.12); --sel: #12345E;
}
:root[data-theme="dark"] {
  --bg: #0E141B; --surface: #16202B; --ink: #E2E9F0; --muted: #8FA1B3;
  --line: #26323F; --accent: #6FA5F2; --accent-ink: #0E141B;
  --accent-soft: rgba(111, 165, 242, 0.14); --copper: #E39A4E;
  --copper-soft: rgba(227, 154, 78, 0.14); --sel: #BDD7FF;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, "Segoe UI", sans-serif;
  margin: 0;
  line-height: 1.45;
}
.wrap { max-width: 1240px; margin: 0 auto; padding: 28px 20px 80px; }
header.top { margin-bottom: 20px; }
h1 {
  font-family: Charter, Georgia, "Times New Roman", serif;
  font-size: 1.7rem;
  font-weight: 700;
  margin: 0 0 4px;
  text-wrap: balance;
}
.sub { color: var(--muted); font-size: 0.92rem; margin: 0; }
.toolbar {
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  margin-top: 16px;
}
#buscar {
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 6px;
  padding: 8px 12px; font-size: 0.9rem; width: 260px; max-width: 100%;
}
#buscar:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.leyenda { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.8rem; color: var(--muted); }
.leyenda span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
.dot.d-sel { background: var(--accent); }
.dot.d-pre { background: transparent; border: 2px solid var(--accent); }
.dot.d-anc { background: var(--accent-soft); border: 1px solid var(--accent); }
.dot.d-dep { background: transparent; border: 2px solid var(--copper); }

.cols { display: grid; grid-template-columns: 1fr 340px; gap: 24px; align-items: start; }
@media (max-width: 900px) { .cols { grid-template-columns: 1fr; } .panel { position: static !important; } }

section.tema { margin-bottom: 18px; }
.tema h2 {
  font-family: Charter, Georgia, serif;
  font-size: 1.02rem; font-weight: 700; margin: 0 0 8px;
  padding-bottom: 4px; border-bottom: 1px solid var(--line);
}
.tema h2 small { color: var(--muted); font-weight: 400; font-size: 0.8rem; margin-left: 8px; }
.pills { display: flex; flex-wrap: wrap; gap: 7px; }
button.pill {
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 999px;
  padding: 5px 12px; font-size: 0.82rem; cursor: pointer;
  font-family: inherit; line-height: 1.3;
  transition: border-color 120ms, background 120ms, opacity 120ms;
}
@media (prefers-reduced-motion: reduce) { button.pill { transition: none; } }
button.pill .nid {
  font-family: ui-monospace, Consolas, monospace;
  font-size: 0.68rem; color: var(--muted); margin-right: 6px;
}
button.pill:hover { border-color: var(--accent); }
button.pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button.pill.sel { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.pill.sel .nid { color: var(--accent-ink); opacity: 0.75; }
button.pill.pre { border: 2px solid var(--accent); background: var(--accent-soft); }
button.pill.pre.blanda { border-style: dashed; }
button.pill.anc { background: var(--accent-soft); }
button.pill.dep { border: 2px solid var(--copper); background: var(--copper-soft); }
button.pill.apagado { opacity: 0.28; }

.panel {
  position: sticky; top: 16px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 18px 18px 20px;
}
.panel .vacio { color: var(--muted); font-size: 0.9rem; }
.panel h3 {
  font-family: Charter, Georgia, serif;
  font-size: 1.15rem; margin: 2px 0 2px; text-wrap: balance;
}
.panel .meta {
  font-family: ui-monospace, Consolas, monospace;
  font-size: 0.72rem; color: var(--muted);
}
.panel .temaLbl { font-size: 0.78rem; color: var(--accent); margin: 4px 0 10px; }
.panel p.desc { font-size: 0.88rem; margin: 0 0 14px; }
.panel h4 {
  font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--muted); margin: 14px 0 6px; font-weight: 600;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
button.chip {
  background: none; border: 1px solid var(--line); border-radius: 6px;
  color: var(--ink); font-size: 0.78rem; padding: 3px 9px; cursor: pointer;
  font-family: inherit; text-align: left;
}
button.chip:hover, button.chip:focus-visible { border-color: var(--accent); outline: none; }
button.chip .peso { color: var(--muted); font-size: 0.7rem; }
.chip.cPre { border-left: 3px solid var(--accent); }
.chip.cDep { border-left: 3px solid var(--copper); }
ul.fuentes { margin: 0; padding: 0 0 0 2px; list-style: none; font-size: 0.82rem; }
ul.fuentes li { margin-bottom: 3px; }
ul.fuentes .libro { color: var(--muted); }
.stats { font-size: 0.78rem; color: var(--muted); margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
</style>

<div class="wrap">
  <header class="top">
    <h1>Mecánica Cuántica · grafo de conocimiento</h1>
    <p class="sub" id="resumen"></p>
    <div class="toolbar">
      <input id="buscar" type="search" placeholder="Filtrar nodos… (ej. Gauss, dieléctrico)" aria-label="Filtrar nodos">
      <div class="leyenda">
        <span><span class="dot d-sel"></span> seleccionado</span>
        <span><span class="dot d-pre"></span> prerrequisito directo</span>
        <span><span class="dot d-anc"></span> ancestro</span>
        <span><span class="dot d-dep"></span> lo necesita</span>
      </div>
    </div>
  </header>

  <div class="cols">
    <main id="temas"></main>
    <aside class="panel" id="panel">
      <p class="vacio">Haz clic en un nodo para ver sus prerrequisitos, qué temas dependen de él y dónde estudiarlo en la bibliografía.</p>
    </aside>
  </div>
</div>

<script>
const GRAFO = {"esquema_version": 1, "materia": "Mecánica Cuántica", "codigo_uva": "", "curso": 4, "granularidad": "fina", "temas": {"1": "Tema 1: Formalismo matemático", "2": "Tema 2: Postulados", "3": "Tema 3: Oscilador armónico", "4": "Tema 4: Momento angular, espín y rotaciones", "5": "Tema 5: Dispersión y colisiones", "6": "Tema 6: Métodos aproximados", "7": "Tema 7: Partículas idénticas (Tema 8 en el desarrollo manuscrito)"}, "nodos": [{"id": "mc.1.01", "tema": 1, "nombre": "Traza de un operador", "descripcion": "Definición de traza, cálculo en una base, invariancia y propiedad cíclica; incluye la discusión de degeneración.", "prerequisitos": [{"id": "cu.04", "peso": 1.0}, {"id": "al.05", "peso": 1.0}, {"id": "m2.02", "peso": 1.0}], "fuentes": {"guia": "Tema 1", "libro": "Cohen-Tannoudji II"}}, {"id": "mc.1.02", "tema": 1, "nombre": "Funciones de operadores", "descripcion": "Construcción de funciones de operadores a partir de su espectro y de las representaciones matriciales.", "prerequisitos": [{"id": "mc.1.01", "peso": 1.0}], "fuentes": {"guia": "Tema 1"}}, {"id": "mc.1.03", "tema": 1, "nombre": "Diferenciación de operadores", "descripcion": "Derivada temporal de operadores, regla del producto y ejemplos de diferenciación de productos y funciones de operadores.", "prerequisitos": [{"id": "mc.1.02", "peso": 1.0}], "fuentes": {"guia": "Tema 1"}}, {"id": "mc.1.04", "tema": 1, "nombre": "Operadores unitarios y operadores transformados", "descripcion": "Operadores unitarios, cambio de base y transformación unitaria de estados y observables.", "prerequisitos": [{"id": "mc.1.03", "peso": 1.0}, {"id": "al.04", "peso": 1.0}], "fuentes": {"guia": "Tema 1"}}, {"id": "mc.1.05", "tema": 1, "nombre": "Bases ortonormales y representaciones matriciales", "descripcion": "Bases ortonormales, componentes de kets y bras, matrices de operadores y matrices unitarias de cambio de base.", "prerequisitos": [{"id": "mc.1.04", "peso": 1.0}], "fuentes": {"guia": "Tema 1"}}, {"id": "mc.1.06", "tema": 1, "nombre": "Autovalores, degeneración y observables", "descripcion": "Ecuaciones de autovalores, espectro, degeneración y lectura de los observables en una base propia.", "prerequisitos": [{"id": "mc.1.05", "peso": 1.0}, {"id": "m2.04", "peso": 1.0}], "fuentes": {"guia": "Tema 1"}}, {"id": "mc.1.07", "tema": 1, "nombre": "Descomposición espectral y proyectores", "descripcion": "Proyectores asociados a subespacios propios y descomposición espectral de operadores.", "prerequisitos": [{"id": "mc.1.06", "peso": 1.0}], "fuentes": {"guia": "Tema 1"}}, {"id": "mc.1.08", "tema": 1, "nombre": "Operador paridad y simetría discreta", "descripcion": "Definición del operador paridad, autovalores ±1, subespacios par e impar y transformación de observables.", "prerequisitos": [{"id": "mc.1.07", "peso": 1.0}], "fuentes": {"guia": "Tema 1"}}, {"id": "mc.1.09", "tema": 1, "nombre": "Reglas de selección por paridad y matrices de Pauli", "descripcion": "Anulación de elementos de matriz por paridad; se conserva la conexión operativa con las matrices de Pauli usadas después para espín 1/2.", "prerequisitos": [{"id": "mc.1.08", "peso": 1.0}], "fuentes": {"guia": "Tema 1"}}, {"id": "mc.2.01", "tema": 2, "nombre": "Postulados: estados, observables y medida", "descripcion": "Estado como rayo del espacio de Hilbert, observables hermíticos y regla general de medida.", "prerequisitos": [{"id": "mc.1.05", "peso": 1.0}], "fuentes": {"guia": "Tema 2"}}, {"id": "mc.2.02", "tema": 2, "nombre": "Probabilidades y reducción del estado", "descripcion": "Descomposición espectral, probabilidades de resultados, espectros discreto y continuo y reducción tras la medida.", "prerequisitos": [{"id": "mc.2.01", "peso": 1.0}], "fuentes": {"guia": "Tema 2"}}, {"id": "mc.2.03", "tema": 2, "nombre": "Incertidumbre, compatibilidad y CCOC", "descripcion": "Valores medios, desviaciones, relaciones de incertidumbre, medida simultánea y conjuntos completos de observables que conmutan.", "prerequisitos": [{"id": "mc.2.01", "peso": 1.0}], "fuentes": {"guia": "Tema 2"}}, {"id": "mc.2.04", "tema": 2, "nombre": "Dinámica de Schrödinger, continuidad y corriente", "descripcion": "Ecuación de Schrödinger, determinismo y superposición; conservación de probabilidad, ecuación de continuidad, corriente y potencial vector.", "prerequisitos": [{"id": "mc.2.01", "peso": 1.0}, {"id": "cu.02", "peso": 1.0}], "fuentes": {"guia": "Tema 2"}}, {"id": "mc.2.05", "tema": 2, "nombre": "Ehrenfest, límite clásico y sistemas conservativos", "descripcion": "Teorema de Ehrenfest, campo de velocidades, comparación clásica-cuántica y evolución de sistemas conservativos.", "prerequisitos": [{"id": "mc.2.04", "peso": 1.0}], "fuentes": {"guia": "Tema 2"}}, {"id": "mc.2.06", "tema": 2, "nombre": "Representación de energía y estados estacionarios", "descripcion": "Constantes del movimiento, base de energía, estados estacionarios, frecuencias de Bohr y evolución de fases relativas.", "prerequisitos": [{"id": "mc.2.05", "peso": 1.0}, {"id": "mc.1.08", "peso": 1.0}], "fuentes": {"guia": "Tema 2"}}, {"id": "mc.2.07", "tema": 2, "nombre": "Operador densidad y mezclas estadísticas", "descripcion": "Estados puros y mezclas, propiedades de la matriz densidad, valor medio, positividad y ensamble canónico.", "prerequisitos": [{"id": "mc.2.06", "peso": 1.0}, {"id": "mc.1.07", "peso": 1.0}], "fuentes": {"guia": "Tema 2"}}, {"id": "mc.2.08", "tema": 2, "nombre": "Productos tensoriales, subsistemas y entrelazamiento", "descripcion": "Estados producto y estados correlacionados, observables de subsistemas, traza parcial y entrelazamiento.", "prerequisitos": [{"id": "mc.2.07", "peso": 1.0}, {"id": "mc.1.07", "peso": 1.0}], "fuentes": {"guia": "Tema 2"}}, {"id": "mc.2.09", "tema": 2, "nombre": "Operador de evolución, imágenes y sistemas de dos niveles", "descripcion": "Evolución unitaria y operador de evolución; imágenes de Schrödinger y Heisenberg; aplicación al sistema de dos niveles y oscilaciones de Rabi.", "prerequisitos": [{"id": "mc.2.06", "peso": 1.0}, {"id": "mc.1.09", "peso": 1.0}], "fuentes": {"guia": "Tema 2"}}, {"id": "mc.3.01", "tema": 3, "nombre": "Oscilador 1-D: variables adimensionales y operadores escalera", "descripcion": "Hamiltoniano adimensional, operadores creación y aniquilación, operador número y álgebra de conmutación.", "prerequisitos": [{"id": "mc.1.08", "peso": 1.0}, {"id": "cu.02", "peso": 1.0}], "fuentes": {"guia": "Tema 3"}}, {"id": "mc.3.02", "tema": 3, "nombre": "Espectro, estado fundamental y funciones de Hermite", "descripcion": "Cuantización del operador número, energía del oscilador, estado fundamental, construcción de autoestados y funciones de Hermite.", "prerequisitos": [{"id": "mc.3.01", "peso": 1.0}], "fuentes": {"guia": "Tema 3"}}, {"id": "mc.3.03", "tema": 3, "nombre": "Valores medios, incertidumbre y evolución del oscilador", "descripcion": "Elementos de matriz, valores medios de X y P, incertidumbre, teorema del virial y evolución temporal.", "prerequisitos": [{"id": "mc.3.02", "peso": 1.0}], "fuentes": {"guia": "Tema 3"}}, {"id": "mc.3.04", "tema": 3, "nombre": "Osciladores 2-D/3-D, campo eléctrico y equilibrio térmico", "descripcion": "Degeneración del oscilador 2-D y 3-D, oscilador cargado en campo eléctrico, desplazamiento y polarización, función de partición, límites térmicos e inversión de población.", "prerequisitos": [{"id": "mc.3.03", "peso": 1.0}, {"id": "mc.1.07", "peso": 1.0}], "fuentes": {"guia": "Tema 3"}}, {"id": "mc.4.01", "tema": 4, "nombre": "Álgebra del momento angular", "descripcion": "Relaciones de conmutación, operadores escalera, espectro de J² y Jz y bases estándar del momento angular.", "prerequisitos": [{"id": "mc.1.05", "peso": 1.0}, {"id": "cu.05", "peso": 1.0}], "fuentes": {"guia": "Tema 4"}}, {"id": "mc.4.02", "tema": 4, "nombre": "Momento angular orbital y grupo de rotaciones", "descripcion": "Partícula sin espín, armónicos esféricos, representación unitaria de rotaciones, generadores y rotaciones finitas.", "prerequisitos": [{"id": "mc.4.01", "peso": 1.0}, {"id": "m2.08", "peso": 0.5}], "fuentes": {"guia": "Tema 4"}}, {"id": "mc.4.03", "tema": 4, "nombre": "Espín 1/2, espacios de espín y espinores", "descripcion": "Espacio de estados de espín 1/2, representación en bases de espín y coordenadas, espinores, operadores de Pauli y medidas parciales.", "prerequisitos": [{"id": "mc.4.02", "peso": 1.0}, {"id": "mc.1.09", "peso": 1.0}], "fuentes": {"guia": "Tema 4"}}, {"id": "mc.4.04", "tema": 4, "nombre": "Momento magnético, precesión de Larmor y dos niveles", "descripcion": "Acoplamiento del espín a un campo magnético, momento magnético, precesión de Larmor, dinámica de dos niveles y transición entre niveles.", "prerequisitos": [{"id": "mc.4.03", "peso": 1.0}, {"id": "em.6.05", "peso": 0.5}], "fuentes": {"guia": "Tema 4"}}, {"id": "mc.4.05", "tema": 4, "nombre": "Rotaciones y transformación de observables", "descripcion": "Rotaciones globales y del espacio completo, transformación de operadores y observables escalares y vectoriales.", "prerequisitos": [{"id": "mc.4.03", "peso": 1.0}], "fuentes": {"guia": "Tema 4"}}, {"id": "mc.4.06", "tema": 4, "nombre": "Suma de dos momentos angulares", "descripcion": "Producto tensorial y base acoplada; estados singlete y triplete como caso de dos espines 1/2.", "prerequisitos": [{"id": "mc.4.03", "peso": 1.0}, {"id": "mc.1.07", "peso": 1.0}], "fuentes": {"guia": "Tema 4"}}, {"id": "mc.4.07", "tema": 4, "nombre": "Acoplamiento general y coeficientes de Clebsch–Gordan", "descripcion": "Valores permitidos de J, degeneraciones, construcción de multipletes y coeficientes de Clebsch–Gordan para momentos angulares acoplados.", "prerequisitos": [{"id": "mc.4.06", "peso": 1.0}], "fuentes": {"guia": "Tema 4"}}, {"id": "mc.4.08", "tema": 4, "nombre": "Wigner–Eckart, reglas de selección y Landé", "descripcion": "Componentes esféricas de operadores vectoriales, teorema de Wigner–Eckart, reglas de selección, proyección/factor de Landé y aplicación al acoplamiento LS de átomos multielectrónicos.", "prerequisitos": [{"id": "mc.4.07", "peso": 1.0}], "fuentes": {"guia": "Tema 4"}}, {"id": "mc.5.01", "tema": 5, "nombre": "Scattering: sección eficaz, amplitud y estados asintóticos", "descripcion": "Dispersión elástica, dispositivo experimental, sección eficaz diferencial, estados estacionarios y forma asintótica de la amplitud.", "prerequisitos": [{"id": "mc.2.05", "peso": 1.0}, {"id": "mo.03", "peso": 1.0}], "fuentes": {"guia": "Tema 5"}}, {"id": "mc.5.02", "tema": 5, "nombre": "Flujo, interferencia y teorema óptico", "descripcion": "Flujo de probabilidad, término de interferencia entre onda incidente y dispersada, paquetes de onda y teorema óptico.", "prerequisitos": [{"id": "mc.5.01", "peso": 1.0}], "fuentes": {"guia": "Tema 5"}}, {"id": "mc.5.03", "tema": 5, "nombre": "Ecuación integral y funciones de Green", "descripcion": "Funciones de Green entrante y saliente, condición asintótica y ecuación integral para la función y la amplitud de scattering.", "prerequisitos": [{"id": "mc.5.01", "peso": 1.0}, {"id": "m2.02", "peso": 0.5}], "fuentes": {"guia": "Tema 5"}}, {"id": "mc.5.04", "tema": 5, "nombre": "Aproximación de Born y rango de validez", "descripcion": "Primera aproximación y serie de Born, criterio de validez y aplicación a potenciales de Yukawa y Coulomb apantallado.", "prerequisitos": [{"id": "mc.5.03", "peso": 1.0}, {"id": "m2.04", "peso": 0.5}], "fuentes": {"guia": "Tema 5"}}, {"id": "mc.5.05", "tema": 5, "nombre": "Ondas parciales, parámetro de impacto y desfasajes", "descripcion": "Expansión en ondas parciales, cambio entre ondas planas y esféricas, parámetro de impacto, comportamiento asintótico y desplazamientos de fase.", "prerequisitos": [{"id": "mc.5.01", "peso": 1.0}, {"id": "mc.4.02", "peso": 1.0}], "fuentes": {"guia": "Tema 5"}}, {"id": "mc.5.06", "tema": 5, "nombre": "Aplicaciones de ondas parciales y resonancias", "descripcion": "Scattering por esfera impenetrable y pozos, resonancias de const nodos = GRAFO.nodos;
const porId = Object.fromEntries(nodos.map(n => [n.id, n]));
const dependientes = {};
nodos.forEach(n => (n.prerequisitos || []).forEach(p => {
  (dependientes[p.id] = dependientes[p.id] || []).push(n.id);
}));

const NOMBRES_LIBROS = {
  wangsness: "Wangsness", griffiths: "Griffiths", jackson: "Jackson",
  feynman: "Feynman", panofsky: "Panofsky", thide: "Thidé",
  problemas: "Problemas (López/Núñez)", apuntes: "Apuntes UVa"
};
function nombreDe(id) {
  return porId[id] ? porId[id].nombre : id + " (otra asignatura)";
}

document.getElementById("resumen").textContent =
  nodos.length + " nodos · " +
  nodos.reduce((a, n) => a + (n.prerequisitos || []).length, 0) + " aristas de prerrequisito · " +
  Object.keys(GRAFO.temas).length + " temas · guía docente " + GRAFO.codigo_uva + " (UVa)";

const contTemas = document.getElementById("temas");
Object.keys(GRAFO.temas).sort((a, b) => +a - +b).forEach(t => {
  const sec = document.createElement("section");
  sec.className = "tema";
  const nds = nodos.filter(n => String(n.tema) === t);
  sec.innerHTML = "<h2>" + GRAFO.temas[t] + "<small>" + nds.length + " nodos</small></h2>";
  const pills = document.createElement("div");
  pills.className = "pills";
  nds.forEach(n => {
    const b = document.createElement("button");
    b.className = "pill";
    b.dataset.id = n.id;
    b.innerHTML = '<span class="nid">' + n.id.replace("em.", "") + "</span>" + n.nombre;
    b.addEventListener("click", () => seleccionar(n.id));
    pills.appendChild(b);
  });
  sec.appendChild(pills);
  contTemas.appendChild(sec);
});

function ancestros(id) {
  const res = new Set();
  const cola = [id];
  while (cola.length) {
    const actual = porId[cola.pop()];
    if (!actual) continue;
    (actual.prerequisitos || []).forEach(p => {
      if (!res.has(p.id)) { res.add(p.id); cola.push(p.id); }
    });
  }
  return res;
}

let seleccionado = null;

function seleccionar(id) {
  const n = porId[id];
  if (!n) return; // prerrequisito de otra asignatura: no está en este visor
  seleccionado = id;
  const directos = new Map((n.prerequisitos || []).map(p => [p.id, p.peso]));
  const anc = ancestros(id);
  const deps = dependientes[id] || [];

  document.querySelectorAll("button.pill").forEach(b => {
    const bid = b.dataset.id;
    b.classList.remove("sel", "pre", "anc", "dep", "blanda");
    if (bid === id) b.classList.add("sel");
    else if (directos.has(bid)) {
      b.classList.add("pre");
      if (directos.get(bid) < 1) b.classList.add("blanda");
    }
    else if (anc.has(bid)) b.classList.add("anc");
    else if (deps.includes(bid)) b.classList.add("dep");
  });

  const fuentes = Object.entries(n.fuentes || {}).map(([k, v]) =>
    "<li><span class='libro'>" + (NOMBRES_LIBROS[k] || k) + ":</span> " + v + "</li>").join("");

  const chipsPre = (n.prerequisitos || []).map(p =>
    "<button class='chip cPre' data-go='" + p.id + "'>" + nombreDe(p.id) +
    (p.peso < 1 ? " <span class='peso'>(" + p.peso + ")</span>" : "") + "</button>").join("") ||
    "<span class='vacio'>Ninguno — nodo raíz.</span>";

  const chipsDep = deps.map(d =>
    "<button class='chip cDep' data-go='" + d + "'>" + porId[d].nombre + "</button>").join("") ||
    "<span class='vacio'>Ninguno (final de rama).</span>";

  document.getElementById("panel").innerHTML =
    "<div class='meta'>" + n.id + "</div>" +
    "<h3>" + n.nombre + "</h3>" +
    "<div class='temaLbl'>" + GRAFO.temas[String(n.tema)] + "</div>" +
    "<p class='desc'>" + n.descripcion + "</p>" +
    "<h4>Prerrequisitos directos</h4><div class='chips'>" + chipsPre + "</div>" +
    "<h4>Lo necesitan</h4><div class='chips'>" + chipsDep + "</div>" +
    "<h4>Dónde estudiarlo</h4><ul class='fuentes'>" + fuentes + "</ul>" +
    "<div class='stats'>" + anc.size + " nodos en su cadena de prerrequisitos · desbloquea " +
    deps.length + " directamente</div>";

  document.querySelectorAll("#panel button.chip").forEach(c =>
    c.addEventListener("click", () => {
      seleccionar(c.dataset.go);
      const pill = document.querySelector("button.pill[data-id='" + c.dataset.go + "']");
      if (pill) pill.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    }));
}

document.getElementById("buscar").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll("button.pill").forEach(b => {
    const n = porId[b.dataset.id];
    const texto = (n.id + " " + n.nombre + " " + n.descripcion).toLowerCase();
    b.classList.toggle("apagado", q !== "" && !texto.includes(q));
  });
});
</script>
